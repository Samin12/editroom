[workspace]
resolver = "2"
members = ["crates/core", "crates/gfx", "crates/ingest", "crates/cut", "crates/privacy", "crates/render", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AI-Answer/cutroom"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
rayon = "1"
tiny-skia = "0.11"
cutroom-core = { path = "crates/core" }
cutroom-gfx = { path = "crates/gfx" }
cutroom-ingest = { path = "crates/ingest" }
cutroom-cut = { path = "crates/cut" }
cutroom-privacy = { path = "crates/privacy" }
cutroom-render = { path = "crates/render" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev.package."*"]
opt-level = 2
